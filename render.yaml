# ==========================================
# Render Blueprint Specification (render.yaml)
# Deploy Enterprise RAG Assistant on Render
# ==========================================

databases:
  - name: rag-postgres
    databaseName: enterprise_rag
    user: postgres
    plan: free
    postgresMajorVersion: 16

services:
  # Managed Redis for Rate Limiting & Cache
  - type: redis
    name: rag-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # Internal network only

  # FastAPI Backend API Service
  - type: web
    name: rag-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rag-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: rag-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_CORS_ORIGINS
        value: "[\"*\"]"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # Next.js 16 Frontend Web Client
  - type: web
    name: rag-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: rag-backend
          property: host
